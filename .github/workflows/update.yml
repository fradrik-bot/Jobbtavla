name: Uppdatera jobb
on:
  schedule:
       - cron: "15 4,9,13,17 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Hämta jobb från alla källor
        run: python fetch_jobs.py
      - name: Bygg sidan
        run: python build.py
      - name: Spara
        run: |
          git config user.name "jobbtavla-bot"
          git config user.email "jobbtavla-bot@users.noreply.github.com"
          git add jobs.json index.html
          git diff --cached --quiet || git commit -m "Jobb uppdaterade $(date -u +%F)"
          git push
